[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acta-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) stdio server for Acta Brain"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "Acta Contributors" }
]
keywords = ["mcp", "model-context-protocol", "acta", "vector-database", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.scripts]
acta-mcp = "acta_mcp.server:main"
acta-mcp = "acta_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["python/acta_mcp"]
