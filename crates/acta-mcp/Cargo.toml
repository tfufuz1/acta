[lints]
workspace = true

[package]
name = "acta-mcp"
version.workspace = true
edition.workspace = true

[package.metadata.acta]
ring = "4"

[features]
default = []
agent-workflows = ["acta-agent"]
onnx = ["acta-infer-onnx", "acta-infer-onnx/onnx"]
candle = ["dep:acta-infer-candle"]
ollama = ["dep:acta-infer-ollama", "acta/ollama"]
kv-bridge = ["acta-infer-candle/kv-bridge", "dep:acta-infer-candle"]
test-utils = []

[dependencies]
acta = { workspace = true, features = ["router"] }
acta-types = { workspace = true }
acta-ports = { workspace = true }
acta-license = { workspace = true }
acta-wire = { workspace = true }
acta-rank = { workspace = true }
acta-adapt = { workspace = true }
acta-crypto = { workspace = true }
acta-privacy = { workspace = true }
acta-infer-onnx = { workspace = true, optional = true }
acta-infer-ollama = { workspace = true, optional = true }
acta-agent = { workspace = true, optional = true }
acta-infer-candle = { workspace = true, optional = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
rand = { workspace = true }
parking_lot = { workspace = true }
scc = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = "0.1"
# NO Axum — MCP transport is stdio only (ADR-010). Adding HTTP here is an architecture violation.
# MCP stdio transport helpers (already transitively present via tokio)
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
