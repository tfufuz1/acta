[lints]
workspace = true

[package]
name = "acta-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.acta]
ring = "4"

[features]
default = []
test-utils = []

[dependencies]
acta-types = { workspace = true }
acta-ports = { workspace = true }
acta-wire = { workspace = true }
acta-rank = { workspace = true }
acta-crypto = { workspace = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
rand = { workspace = true }
parking_lot = { workspace = true }
scc = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = "0.1"
# NO Axum — MCP transport is stdio only (ADR-010). Adding HTTP here is an architecture violation.
# MCP stdio transport helpers (already transitively present via tokio)
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
