[lints]
workspace = true

[package]
name = "acta-infer-candle"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Candle GGUF ML inference backend for Acta"

[package.metadata.acta]
ring = "2"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.21"
bytes = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
tracing = { workspace = true }
bincode = { workspace = true, optional = true }
half = "2.4"
acta-types = { workspace = true }
acta-ports = { workspace = true }
acta-rank = { workspace = true }
parking_lot = { workspace = true }
acta-crypto = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.4"
criterion = { workspace = true }
acta-crypto = { workspace = true }

[[bench]]
name = "kv_bridge_bench"
harness = false
required-features = ["kv-bridge"]

[features]
default = []
candle = []
kv-bridge = ["dep:acta-crypto", "acta-crypto/kv-encryption", "dep:bincode"]
kv-stage-b = ["dep:bincode"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
test-utils = []

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }
