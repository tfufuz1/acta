[lints]
workspace = true

[package]
name = "acta-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Python bindings for Acta using PyO3"
# ADR-N04 (PHASE0-T3): FFI panic translation to PyErr and panic containment

[package.metadata.acta]
ring = "4"

[lib]
name = "_acta"
crate-type = ["cdylib", "rlib"]
test = true
doctest = false

[dependencies]
acta-types = { workspace = true }
pyo3 = { version = "0.24.1", features = ["extension-module", "abi3-py38", "multiple-pymethods"] }
numpy = "0.24"
tokio = { workspace = true }
# ANCHOR:ARCH:DAG-003 — Architektur-Layer durchbrochen (Ausnahme für Bindings)
# WP:NONE PRIO:2 NEEDS:NONE
# AGENT:06 DATE:2026-05-09 STATUS:DONE
# VERLETZUNG: acta-py importiert acta-db, acta-router und acta-rank gegen die DAG-Invariante.
# RECHTFERTIGUNG: Als High-Level Python-Bridge (Layer 3) benötigt acta-py Zugriff
# auf die orchestrating Facade in acta-db sowie Routing- und Kalibrierungskomponenten. Dies ist eine beabsichtigte Ausnahme
# vom Sovereign Core DAG, da Bindings per Definition an der Grenze zum Nutzer stehen.
acta-rank = { workspace = true }
acta-adapt = { workspace = true }
parking_lot = { workspace = true }
acta-wire = { workspace = true }
acta-store = { workspace = true }
acta-db = { workspace = true }
flatbuffers = { workspace = true }
serde_json = { workspace = true }
pythonize = "0.24"

[features]
default = []
docid-128 = ["acta-types/docid-128"]
test-hooks = []
