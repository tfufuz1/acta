[lints]
workspace = true

[package]
name = "acta-vector-fuzz" # <!-- crate-ref-ignore -->
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
acta-types = { path = "../../acta-types" }
acta-ports = { path = "../../acta-ports" }
acta-mvcc = { path = "../../acta-mvcc" }
acta-vector = { path = ".." }

[[bin]]
name = "hnsw_insert_search"
path = "fuzz_targets/hnsw_insert_search.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hnsw_persistence"
path = "fuzz_targets/fuzz_hnsw_persistence.rs"
test = false
doc = false
