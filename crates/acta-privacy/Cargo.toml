[lints]
workspace = true

[package]
name = "acta-privacy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cloud Egress Security, DLP & Exfiltration Protection for Acta (Ring 3)"

[package.metadata.acta]
ring = "3"

[dependencies]
# Y.6.2, Clock-Injektion für P28-konforme Hash-Trace-Erzeugung
acta-ports = { workspace = true }
acta-types = { workspace = true }
acta-avv-generator = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
parking_lot = { workspace = true }
tokio = { workspace = true }
scc = "2"
blake3 = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
acta-crypto = { workspace = true, features = ["test-utils"] }
acta-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
