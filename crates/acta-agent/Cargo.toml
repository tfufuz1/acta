[lints]
workspace = true

[package]
name = "acta-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Persistent agent workflow engine for Acta — checkpoint/execute/audit loop"

[package.metadata.acta]
ring = "3"

[features]
default = []
test-utils = []

[dependencies]
acta-types      = { workspace = true }
acta-ports      = { workspace = true }
bytes = { workspace = true }
acta-db         = { workspace = true, features = ["volatile-vault"] }
acta-graph      = { workspace = true }
acta-checkpoint = { workspace = true }
acta-store      = { workspace = true }
acta-router     = { workspace = true }
serde              = { workspace = true, features = ["derive"] }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tokio              = { workspace = true, features = ["full"] }
tokio-util         = { version = "0.7.18", features = ["rt"] }

[dev-dependencies]
acta-testkit   = { workspace = true }
tempfile           = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
acta-vector     = { workspace = true }
acta-text       = { workspace = true }
