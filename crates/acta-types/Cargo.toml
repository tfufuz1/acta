[lints]
workspace = true

[package]
name = "acta-types"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Canonical domain types, IDs, budgets, filters, and error types for Acta"

[package.metadata.acta]
ring = "0"

[features]
default = []
docid-128 = ["acta-ids/docid-128"]
auto-extraction-opt-out = []

[dependencies]
acta-ids = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
ahash = { workspace = true, features = ["serde"] }
blake3 = { workspace = true }
sha2 = "0.10"
bytes = { workspace = true }

[dev-dependencies]
proptest = "1.4"
criterion = { workspace = true }

[[bench]]
name = "types_bench"
harness = false
