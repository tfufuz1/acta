description = "WASM Execution Boundary for Acta MCP CodeExecution Permission"

[package.metadata.acta]
ring = "2"

[dependencies]
wasmtime = { version = "36.0.19", default-features = false, features = ["async", "cranelift"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
anyhow = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wat = "1"
