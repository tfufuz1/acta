[crates.acta-rank]
group = "retrieval"
level = 1
tier = "stable"
path = "crates/acta-rank"
unsafe_island = false
allowed_internal = ["acta-ids", "acta-env"]

[crates.acta-rank.feature_closure_allowed]
workspace = ["acta-types", "acta-ports"]

[crates.acta-rank.dev_allowed]
test = "cargo test -p acta-rank --locked"
