[lints]
workspace = true

[package]
name = "acta-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic test utilities, ManualClock, InMemoryStorageEngine, and FaultVfs for Acta"

[package.metadata.acta]
ring = "tooling"

[features]
default = ["testkit"]
testkit = []

[dependencies]
acta-ports = { workspace = true, features = ["testkit"] }
acta-types = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
