[lints]
workspace = true

[package]
name = "acta-crypto-fuzz" # <!-- crate-ref-ignore -->
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
bincode = "1.3"
acta-types = { path = "../../acta-types" }
acta-ports = { path = "../../acta-ports" }
acta-crypto = { path = ".." }

[[bin]]
name = "wal_hmac_chain_verify_fuzz"
path = "fuzz_targets/wal_hmac_chain_verify_fuzz.rs"
test = false
doc = false
