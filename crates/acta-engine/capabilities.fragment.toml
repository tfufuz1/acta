# Schema v3 capabilities fragment for acta-engine (SPEC §8.3)
[crates.acta-engine]
group = "integration"
level = 2
tier = "stable"
path = "crates/acta-engine"
unsafe_island = false
allowed_internal = [
    "acta-types",
    "acta-ports",
    "acta-mvcc",
    "acta-checkpoint",
    "acta-store",
    "acta-vector",
    "acta-text",
    "acta-graph",
    "acta-rank",
]

[crates.acta-engine.feature_closure_allowed]
adaptive-candidate-pool-sizing = ["acta-adapt"]
onnx = ["acta-infer-onnx"]
sandbox = ["acta-sandbox"]

[crates.acta-engine.dev_allowed]
ingest = ["acta-ingest"]
testkit = ["acta-testkit"]
test = "cargo test -p acta-engine --locked"
