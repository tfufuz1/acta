[lints]
workspace = true

[package]
name = "acta-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Acta — Core storage, index, and transaction orchestrator engine (Deprecated Façade)"

[package.metadata.acta]
ring = "3"

[dependencies]
acta-db = { workspace = true }

[features]
default = []
onnx = ["acta-db/onnx"]
sandbox = ["acta-db/sandbox"]
reranking = ["acta-db/reranking"]
experimental-diskann = ["acta-db/experimental-diskann"]
background-maintenance = ["acta-db/background-maintenance"]
graph-connectivity-health = ["acta-db/graph-connectivity-health"]
edge-reinforcement-learning = ["acta-db/edge-reinforcement-learning"]
adaptive-candidate-pool-sizing = ["acta-db/adaptive-candidate-pool-sizing"]
exp-extraction = ["acta-db/exp-extraction"]
entity-extraction = ["acta-db/entity-extraction"]
auto-extraction-opt-out = ["acta-db/auto-extraction-opt-out"]
