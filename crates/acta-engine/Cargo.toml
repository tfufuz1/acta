[lints]
workspace = true

[package]
name = "acta-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Orchestrierung: Mandanten, Collections, Transaktionen, Suche, Hintergrundtasks."

[package.metadata.acta]
ring = "3"

[dependencies]
acta-sys = { workspace = true }
acta-types = { workspace = true }
acta-ports = { workspace = true }
acta-mvcc = { workspace = true }
bytes = { workspace = true }
acta-crypto = { workspace = true }
acta-store = { workspace = true }
acta-erasure = { path = "../acta-erasure" }
acta-vector = { workspace = true }
acta-text = { workspace = true }
acta-rank = { workspace = true }
ahash = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio-util = { version = "0.7.18", features = ["rt"] }
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
thiserror = { workspace = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
acta-testkit = { workspace = true }
acta-testmacros = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
proptest = "1.4"
loom = "0.7"
wat = "1"
acta-vector = { workspace = true, features = ["experimental-diskann"] }

[features]
default = []
experimental-diskann = ["acta-vector/experimental-diskann"]
