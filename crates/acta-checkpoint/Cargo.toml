[lints]
workspace = true

[package]
name = "acta-checkpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backup and snapshot management for Acta storage"

[package.metadata.acta]
ring = "1"

[dependencies]
acta-types = { version = "0.1.0", path = "../acta-types" }
acta-ports = { version = "0.1.0", path = "../acta-ports" }
acta-mvcc = { version = "0.1.0", path = "../acta-mvcc" }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
parking_lot = { workspace = true }
blake3 = { workspace = true }
futures-executor = "0.3"
dirs = "6.0.0"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
proptest = "1.4"
criterion = { version = "0.5", features = ["async_tokio"] }
acta-testkit = { version = "0.1.0", path = "../acta-testkit" }
acta-store = { version = "0.1.0", path = "../acta-store" }

[[bench]]
name = "checkpoint_bench"
harness = false
