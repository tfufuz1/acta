[lints]
workspace = true

[package]
name = "acta-simd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vektor-Distanzfunktionen (L2, Dot, Cosine) mit SIMD-Kernen und Skalar-Referenz."

[package.metadata.acta]
ring = "0"
klasse = "A"

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
workspace = ["dep:acta-types"]
types-compat = ["workspace"]
simd-avx512 = []

[dependencies]
thiserror = { workspace = true }
bytemuck = "1.25"
tracing = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
acta-types = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"
simsimd = "6.5"
serde_json = { workspace = true }

[[bench]]
name = "simd_bench"
harness = false
