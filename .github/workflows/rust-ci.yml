# Tiefenprüfung = nicht-blockierend (mit Ausnahme der 4 Pflicht-CI-Jobs)
# Dieses Workflow-File fuehrt umfassende Tiefenpruefungen aus (Coverage, Integrationstests, Feature-Matrix, Cross-Platform, Binding-Checks).
# Die 4 Pflicht-CI-Jobs (compile-check, fmt, clippy, test) sind merge-blockierend (ohne continue-on-error), waehrend sonstige Tiefenpruefungen continue-on-error nutzen.

name: Rust CI (Tiefenprüfung)
on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  compile-check:
    name: Compile Check (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Workspace Compile Gate
        run: cargo check --workspace --all-targets --locked

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - name: Run rustfmt check
        run: |
          cargo fmt --all -- --check || (echo "❌ Format Check fehlgeschlagen! Lokal beheben mit: cargo fmt --all && git commit --amend --no-edit" && exit 1)

  supply-chain:
    name: Dependency Security & License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  coverage:
    name: Line Coverage Gate (>= 50%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@4314395b773db6ec53370cf7e57cc6bfefb6ae8f # cargo-llvm-cov
      - name: Generate coverage & enforce threshold
        run: cargo llvm-cov --workspace --locked --fail-under-lines 50
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: target/llvm-cov/html

  per-crate-coverage-report:
    name: Per-Crate Coverage Report (Non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@4314395b773db6ec53370cf7e57cc6bfefb6ae8f # cargo-llvm-cov
      - name: Generate Per-Crate Coverage Summary
        run: |
          echo "## Per-Crate Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Crate | Line Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY

          for crate in acta-store acta-candle acta-db acta-vector; do
            COV_OUTPUT=$(cargo llvm-cov -p "$crate" --locked 2>&1)
            # Parse line coverage percentage from the TOTAL line
            PCT=$(echo "$COV_OUTPUT" | grep -E "^TOTAL" | awk '{print $(NF)}')
            if [ -z "$PCT" ]; then
              PCT="N/A"
            fi
            echo "| \`$crate\` | $PCT |" >> $GITHUB_STEP_SUMMARY
          done

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [compile-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --locked --all-targets --workspace -- -D warnings

  asan-acta-vector:
    name: AddressSanitizer Gate (acta-vector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run acta-vector tests with AddressSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test -p acta-vector --target x86_64-unknown-linux-gnu

  asan-acta-vector-unequal-lengths:
    name: ASan Gate — u8 Distance Unequal Length Slices (acta-vector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compile-check]
    # Dieser Job schlägt FEHL, solange P-G1 (AVX2 OOB-Fix) nicht gemergt ist.
    # Er ist absichtlich als Sicherheitsnetz konzipiert, kein continue-on-error.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run u8 distance unequal-length tests with AddressSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=address" cargo +nightly test \
            -p acta-vector \
            --target x86_64-unknown-linux-gnu \
            -- test_u8_distance_unequal_lengths_return_error \
               test_avx2_u8_unequal_length_no_oob \
            2>&1

  miri-acta-vector:
    name: Miri Gate (acta-vector unsafe fn boundary tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [compile-check]
    continue-on-error: true  # Miri-Failures blockieren nicht den Merge, werden aber sichtbar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run Miri on acta-vector
        run: |
          # Nur Scalar-Pfad unter Miri (SIMD-Intrinsics werden von Miri nicht unterstützt)
          # Miri fängt OOB-Zugriffe im Scalar-Tail-Loop auf.
          MIRIFLAGS="-Zmiri-disable-isolation" cargo +nightly miri test \
            -p acta-vector \
            -- test_u8_distance_unequal_lengths_return_error \
               test_scalar_u8_no_oob \
            2>&1

  cargo-hack-feature-check:
    name: Cargo Hack Feature Flag Matrix Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Run cargo hack --each-feature --workspace --no-dev-deps
        run: cargo hack check --each-feature --workspace --no-dev-deps

  feature-matrix:
    name: Feature Matrix Checks (Powerset CI §17)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Workspace --no-default-features Check
        run: cargo check --locked --workspace --no-default-features
      - name: Check acta-store Feature Combinations
        run: |
          cargo check --locked -p acta-store --no-default-features
          cargo check --locked -p acta-store --features block-cache-v2
          cargo check --locked -p acta-store --features sieve-cache
          cargo check --locked -p acta-store --features fault-injection
          cargo check --locked -p acta-store --features block-cache-v2,sieve-cache,fault-injection
      - name: Check acta-vector Feature Combinations
        run: |
          cargo check --locked -p acta-vector --no-default-features
          cargo check --locked -p acta-vector --features experimental-diskann
          cargo check --locked -p acta-vector --features experimental-rabitq
          cargo check --locked -p acta-vector --features graph
          cargo check --locked -p acta-vector --features partial-index-rebuild
          cargo check --locked -p acta-vector --features experimental-diskann,experimental-rabitq,graph,partial-index-rebuild
      - name: Check acta-adapt Feature Combinations
        run: |
          cargo check --locked -p acta-adapt --no-default-features
          cargo check --locked -p acta-adapt --features bandit-routing
          cargo check --locked -p acta-adapt --features flow-corrected-thompson
          cargo check --locked -p acta-adapt --features bandit-routing,flow-corrected-thompson,egress-sherman-morrison
      - name: Check acta-crypto Feature Combinations
        run: |
          cargo check --locked -p acta-crypto --no-default-features
          cargo check --locked -p acta-crypto --features kv-encryption
          cargo check --locked -p acta-crypto --features cloud-egress-guard
          cargo check --locked -p acta-crypto --features kv-encryption,cloud-egress-guard,test-utils
      - name: Check acta-router Feature Combinations
        run: |
          cargo check --locked -p acta-router --no-default-features
          cargo check --locked -p acta-router --features bandit-routing
          cargo check --locked -p acta-router --features cloud-egress-guard
          cargo check --locked -p acta-router --features egress-sherman-morrison
          cargo check --locked -p acta-router --features bandit-routing,cloud-egress-guard,egress-sherman-morrison
      - name: Check acta-infer-onnx Feature Combinations
        run: |
          cargo check --locked -p acta-infer-onnx --no-default-features
          cargo check --locked -p acta-infer-onnx --features onnx
      - name: Check acta-infer-candle Feature Combinations
        run: |
          cargo check --locked -p acta-infer-candle --no-default-features
          cargo check --locked -p acta-infer-candle --features candle
          cargo check --locked -p acta-infer-candle --features kv-bridge,kv-stage-b,acta-store
      - name: Check acta-db Feature Combinations
        run: |
          cargo check --locked -p acta-db --no-default-features
          cargo check --locked -p acta-db --features reranking
          cargo check --locked -p acta-db --features volatile-vault
          cargo check --locked -p acta-db --features experimental-diskann
      - name: Check acta-graph Feature Combinations
        run: |
          cargo check --locked -p acta-graph --no-default-features
          cargo check --locked -p acta-graph --features ppr-forward-push
          cargo check --locked -p acta-graph --features physio-percolation
      - name: Check acta-mcp Feature Combinations
        run: |
          cargo check --locked -p acta-mcp --no-default-features
          cargo check --locked -p acta-mcp --features agent-workflows
          cargo check --locked -p acta-mcp --features onnx
          cargo check --locked -p acta-mcp --features candle
          cargo check --locked -p acta-mcp --features kv-bridge
      - name: Check acta facade Feature Combinations
        run: |
          cargo check --locked -p acta --no-default-features
          cargo check --locked -p acta --all-features

  maturin-dry-run:
    name: PyPI Wheel Build Check (Maturin Dry-Run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install maturin
        run: pip install maturin
      - name: Dry-run maturin build
        run: maturin build --manifest-path crates/acta-py/Cargo.toml

  test:
    name: Test Suite (cargo-nextest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [compile-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest
      - name: Run Tests with Nextest
        run: cargo nextest run --locked --workspace --retries 0 --no-fail-fast
      - name: Report flaky tests
        if: always()
        run: |
          if ls target/nextest/default/*.xml 1> /dev/null 2>&1; then
            RETRY_COUNT=$(grep -o 'flaky="true"' target/nextest/default/*.xml 2>/dev/null | wc -l | tr -d ' ')
            if [ -n "$RETRY_COUNT" ] && [ "$RETRY_COUNT" -gt 0 ]; then
              echo "::warning::${RETRY_COUNT} flaky Test(s) erkannt — moegliche Race Conditions, siehe TESTING.md Abschnitt 2.6 (Concurrency)"
            fi
          fi
      - name: Run Doc Tests
        run: cargo test --doc --locked --workspace

  clippy-py:
    name: Clippy (acta-py)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --manifest-path crates/acta-py/Cargo.toml --all-targets -- -D warnings

  test-py:
    name: Test Suite (acta-py)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --manifest-path crates/acta-py/Cargo.toml

  lockfile-check-py:
    name: Check acta-py Lockfile in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check acta-py Lockfile in sync
        run: |
          cd crates/acta-py
          cargo update --dry-run --locked 2>&1 | grep "^Updating" && \
            echo "::error::acta-py Cargo.lock is out of sync!" && exit 1 || true

  docid-128-check:
    name: DocId 128-bit Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [compile-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Workspace check with acta-types/docid-128
        run: cargo hack check --workspace --ignore-unknown-features --features acta-types/docid-128
      - name: Facade check with docid-128
        run: cargo check -p acta --features docid-128
      - name: Tests in 64-bit mode (types, store, vector)
        run: cargo test -p acta-types -p acta-store -p acta-vector
      - name: Tests in 128-bit mode (types, store, vector)
        run: cargo test -p acta-types -p acta-store -p acta-vector --features acta-types/docid-128

  test-cross-platform:
    name: Cross-Platform Core Tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [compile-check]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test core storage/crypto crates
        run: cargo test --locked -p acta-core -p acta-store -p acta-crypto -p acta-vector -p acta-text -p acta-graph -p acta-checkpoint -p acta-db

  # KONSOLIDIERUNGS-HINWEIS: Der redundante context-gates Job wurde hier entfernt.
  # Die Kanonische Quelle für Context Integrity Gates ist .github/workflows/context-gates.yml,
  # welcher als dedizierter Workflow parallel auf push/pull_request läuft.
