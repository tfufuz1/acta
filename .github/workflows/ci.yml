# Minimal-CI (BL-9, WP-0.2). Die Gates entsprechen CLAUDE.md §3 und Makefile.
# Jeder Job läuft unabhängig, damit ein roter Job die anderen nicht verdeckt.
# Es gibt keinen continue-on-error: rote Jobs bleiben rot.
# Toolchain: rust-toolchain.toml (Pin 1.89.0). Die Aktion setup-rust-toolchain liest diese Datei.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Kompilieren (cargo check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo check --workspace --all-targets

  fmt:
    name: Formatierung (cargo fmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check

  clippy:
    name: Lints (cargo clippy -D warnings)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: Dokumentation (cargo doc -D warnings)
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo doc -p contextra-storage --no-deps

  layering:
    name: Schichtregeln (SPEC §3.3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Quellbaum gegen Schichtregeln prüfen
        run: cargo test -p contextra-storage --test layering
      - name: Laufzeit-Abhängigkeiten prüfen (nur contextra-storage-ports)
        run: |
          deps="$(cargo tree -p contextra-storage -e normal --depth 1 --prefix none \
            | tail -n +2 | awk '{print $1}' | sort -u)"
          echo "Normale Abhängigkeiten:"
          echo "$deps"
          if [ "$deps" != "contextra-storage-ports" ]; then
            echo "Unerwartete Laufzeit-Abhängigkeit in contextra-storage (SPEC §3.3)." >&2
            exit 1
          fi

  test-targets:
    name: Tests je Target
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Jedes Target läuft einzeln. Die Übersicht mit roten Targets steht in der Job-Zusammenfassung.
      - run: scripts/test-targets.sh

  deny:
    name: Abhängigkeiten (cargo deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
