[workspace]
resolver = "2"
members = [
    "crates/acta-durable-fs",
    "crates/acta-wire",
    "crates/acta-sys",
    "crates/acta-simd",
    "crates/acta-store",
    "crates/acta-vector",
    "crates/acta-db",
    "crates/acta-text",
    "crates/acta-checkpoint",
    "crates/acta-crypto",
    "crates/acta-privacy",
    "crates/acta-graph",
    "crates/acta-infer-onnx",
    "crates/acta-mcp",
    "crates/acta-agent",
    "crates/acta-infer-ollama",
    "crates/acta-router",
    "crates/acta-infer-candle",
    "crates/acta-sandbox",
    "crates/acta-py",
    "crates/acta-testkit",
    "crates/acta",
    "crates/acta-types",
    "crates/acta-ports",
    "crates/acta-mvcc",
    "crates/acta-adapt",
    "crates/acta-kvcache",
    "crates/acta-engine",
    "crates/acta-cognition",
    "crates/acta-rank",
    "crates/acta-audit-export",
    "crates/acta-avv-generator",
    "crates/acta-license",
    "crates/acta-ingest",
]
exclude = [
    "crates/acta-vault",
]
# Restored archived crates to default-members:
# acta-graph, acta-cognition, acta-adapt, acta-kvcache, acta-router, acta-agent, acta-infer-onnx, acta-infer-ollama
default-members = [
    "crates/acta-durable-fs",
    "crates/acta-wire",
    "crates/acta-sys",
    "crates/acta-simd",
    "crates/acta-types",
    "crates/acta-ports",
    "crates/acta-mvcc",
    "crates/acta-crypto",
    "crates/acta-vector",
    "crates/acta-text",
    "crates/acta-rank",
    "crates/acta-store",
    "crates/acta-checkpoint",
    "crates/acta-engine",
    "crates/acta-db",
    "crates/acta-mcp",
    "crates/acta",
    "crates/acta-testkit",
    "crates/acta-graph",
    "crates/acta-cognition",
    "crates/acta-adapt",
    "crates/acta-kvcache",
    "crates/acta-router",
    "crates/acta-agent",
    "crates/acta-infer-onnx",
    "crates/acta-infer-ollama",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
acta-ids = { path = "crates/acta-ids" }
acta-env = { path = "crates/acta-env" }
acta-durable-fs = { path = "crates/acta-durable-fs" }
# Error handling
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3.3"
flatbuffers = "24.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Data structures
bytes = "1"
memmap2 = "0.9.11"
ahash = { version = "0.8", features = ["serde"] }
itoa = "1"
parking_lot = "0.12"
roaring = "0.10"
regex = "1"

# Crypto & hashing
blake3 = "1"
crc32fast = "1.3"

# Concurrency
rand = "0.8"

# Observability
tracing = "0.1"

# Testing
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace crates
acta-wire = { path = "crates/acta-wire" }
acta-sys = { path = "crates/acta-sys" }
acta-simd = { path = "crates/acta-simd" }
acta-store = { path = "crates/acta-store" }
acta-vector = { path = "crates/acta-vector" }
acta-index = { package = "acta-vector", path = "crates/acta-vector" } # <!-- crate-ref-ignore -->
acta-db = { path = "crates/acta-db" }
acta-text = { path = "crates/acta-text" }
acta-checkpoint = { path = "crates/acta-checkpoint" }
acta-crypto = { path = "crates/acta-crypto" }
acta-privacy = { path = "crates/acta-privacy" }
acta-graph = { path = "crates/acta-graph" }
acta-infer-onnx = { path = "crates/acta-infer-onnx" }
acta-embed = { package = "acta-infer-onnx", path = "crates/acta-infer-onnx" } # <!-- crate-ref-ignore -->
acta-mcp   = { path = "crates/acta-mcp" }
acta-agent = { path = "crates/acta-agent" }
acta-infer-ollama = { path = "crates/acta-infer-ollama" }
acta-ollama = { package = "acta-infer-ollama", path = "crates/acta-infer-ollama" } # <!-- crate-ref-ignore -->
acta-router = { path = "crates/acta-router" }
acta-infer-candle = { path = "crates/acta-infer-candle" }
acta-candle = { package = "acta-infer-candle", path = "crates/acta-infer-candle" } # <!-- crate-ref-ignore -->
acta-sandbox = { path = "crates/acta-sandbox" }
acta-py = { path = "crates/acta-py" }
acta-testkit = { path = "crates/acta-testkit" }
acta = { path = "crates/acta" }
acta-types = { path = "crates/acta-types" }
acta-ports = { path = "crates/acta-ports" }
acta-mvcc = { path = "crates/acta-mvcc" }
acta-adapt = { path = "crates/acta-adapt" }
acta-kvcache = { path = "crates/acta-kvcache" }
acta-engine = { path = "crates/acta-engine" }
acta-cognition = { path = "crates/acta-cognition" }
acta-rank = { path = "crates/acta-rank" }
acta-audit-export = { path = "crates/acta-audit-export" }
acta-avv-generator = { path = "crates/acta-avv-generator" }
acta-license = { path = "crates/acta-license" }
acta-erasure = { path = "crates/acta-erasure" }
acta-ingest = { path = "crates/acta-ingest" }

# Ingestion dependencies
unicode-segmentation = "1.12"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
encoding_rs = "0.8"
html5ever = "0.29"
markup5ever_rcdom = "0.3"
calamine = "0.30"
csv = "1.3"
lopdf = "0.35"
cfb = "0.10"
mail-parser = "0.9"
yaml-rust2 = "0.9"
toml = "0.8"

# ── Archived Zone ──────────────────────────────────────────────────────────────
# acta-cluster, acta-sandbox, acta-saos-agent wurden in Phase 0 ausgelagert. <!-- crate-ref-ignore -->
# acta-embed    → ONNX-Embeddings (wird via Feature-Flag optional) <!-- crate-ref-ignore -->

# 🧊 Frozen Zone — external deps for future reactivation
# openraft = { version = "0.9", features = ["storage-v2", "serde"] }
# tonic = { version = "0.12", features = ["tls"] }
# prost = "0.13"
#
# Embedding & ML (activate with acta-infer-onnx feature)
# ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-24"] }
# hf-hub = { version = "0.3", default-features = false }
# tokenizers = "0.19"
# ndarray = "0.15"
#
# Network
# reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(loom)', 'cfg(feature, values("onnx"))'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# K-13: await_holding_lock fehlte (SPEC §17.3, PLAN.md WP 0.4)
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# SPEC §17.3: zusätzliche Sicherheits-Lints
indexing_slicing = "deny"
exit = "deny"
dbg_macro = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
overflow-checks = true

# Profile for standalone binaries without FFI/PyO3 bindings.
[profile.release-abort]
inherits = "release"
panic = "abort"

[profile.bench]
inherits = "release"
