[workspace]
resolver = "2"
members = [
    "crates/acta-types",
    "crates/acta-ports",
    "crates/acta-sys",
    "crates/acta-simd",
    "crates/acta-mvcc",
    "crates/acta-crypto",
    "crates/acta-store",
    "crates/acta-text",
    "crates/acta-vector",
    "crates/acta-graph",
    "crates/acta-rank",
    "crates/acta-engine",
    "crates/acta-db",
    "crates/acta-mcp",
]
# Fuzz-Crates haben ein eigenes Manifest (cargo-fuzz) und gehören nicht zum Workspace.
exclude = ["crates/*/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
# --- interne Crates (Schichten siehe docs/ARCHITECTURE.md) ---
acta-types  = { path = "crates/acta-types" }
acta-ports  = { path = "crates/acta-ports" }
acta-sys    = { path = "crates/acta-sys" }
acta-simd   = { path = "crates/acta-simd" }
acta-mvcc   = { path = "crates/acta-mvcc" }
acta-crypto = { path = "crates/acta-crypto" }
acta-store  = { path = "crates/acta-store" }
acta-text   = { path = "crates/acta-text" }
acta-vector = { path = "crates/acta-vector" }
acta-graph  = { path = "crates/acta-graph" }
acta-rank   = { path = "crates/acta-rank" }
acta-engine = { path = "crates/acta-engine" }
acta-db     = { path = "crates/acta-db" }

# --- externe Crates ---
ahash = "0.8"
bincode = "1.3"
blake3 = "1"
bytes = "1"
crc32fast = "1"
criterion = "0.5"
itoa = "1"
memmap2 = "0.9"
parking_lot = "0.12"
rand = "0.8"
regex = "1"
roaring = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Server-/Bibliotheksbetrieb: Fehler werden gemeldet, nicht erzwungen verboten.
# Echtzeit-Strenge (deny) der Robotik-Herkunft ist bewusst auf warn gesenkt.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 16
opt-level = 3
debug = "line-tables-only"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1
