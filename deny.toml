# Konfiguration für `cargo deny check` (CI-Job `deny`, cargo-deny 0.22).
# Lizenz-Allowlist unverändert. `unlicensed = "deny"` entfällt, weil der Schlüssel in
# cargo-deny >= 0.16 entfernt wurde; unlizenzierte Crates sind dort ohnehin verboten.

[advisories]
# Bekannte Sicherheitslücken (RustSec) blockieren den Job. Ausnahmen nur mit ID und Begründung hier eintragen.
ignore = []
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
]

# Ausnahme statt Erweiterung der Allowlist: `subtle` steht unter BSD-3-Clause, ist eine
# Abhängigkeit von `contextra-crypto-ref` (Dev-Crate, O-6) und nicht Teil des Laufzeit-Kerns.
[[licenses.exceptions]]
crate = "subtle"
allow = ["BSD-3-Clause"]

[bans]
# Doppelte Versionen sind nur Hinweis; Auflösung erfolgt schrittweise.
multiple-versions = "warn"
# Path-Abhängigkeiten im Workspace (`contextra-storage-ports`) haben noch keine Version, weil
# Cargo.toml in diesem Schritt nicht geändert wird. Deshalb nur Warnung. Auf "deny" stellen,
# sobald die Versionen in den Manifesten stehen (offener Punkt im PR).
wildcards = "warn"
# Keine Abhängigkeit ist explizit verboten. Eintrag hier, falls eine Crate ausgeschlossen werden soll.
deny = []

[sources]
# Nur crates.io. Git-Abhängigkeiten und fremde Registries brauchen eine Entscheidung im Repo.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
